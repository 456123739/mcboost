name: 构建 PCL CE 加速

on:
  push:
    branches: [main, master]
    paths:
      - 'pcl-hook/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: 编译钩子 DLL
        run: dotnet build pcl-hook/PclHook/PclHook.csproj -c Release -p:Platform=x64 -o pcl-hook/out/hook

      - name: 编译启动器
        run: dotnet build pcl-hook/Launcher/McBoostLauncher.csproj -c Release -p:Platform=x64 -o pcl-hook/out/launcher

      - name: 校验 StartupHook 契约
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dll = "pcl-hook/out/hook/PclHook.dll"
          if (-not (Test-Path $dll)) { throw "缺少 PclHook.dll" }

          # 用反射加载，确认 StartupHook 类型存在于全局命名空间且有 Initialize()
          $asm = [System.Reflection.Assembly]::LoadFrom((Resolve-Path $dll))
          $hook = $asm.GetType("StartupHook")
          if ($hook -eq $null) { throw "找不到全局命名空间的 StartupHook 类型 —— 启动钩子不会生效" }
          $init = $hook.GetMethod("Initialize", [System.Reflection.BindingFlags]::Public -bor [System.Reflection.BindingFlags]::Static)
          if ($init -eq $null) { throw "StartupHook 缺少 public static void Initialize()" }
          if ($init.GetParameters().Length -ne 0) { throw "Initialize 不能有参数" }
          Write-Host "  OK   StartupHook.Initialize() 契约通过（全局命名空间）"

          # 架构校验
          $b = [System.IO.File]::ReadAllBytes((Resolve-Path $dll))
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          if ($machine -ne 0x8664) { throw "PclHook.dll 不是 x64 (machine=0x$($machine.ToString('X4')))" }
          Write-Host "  OK   PclHook.dll machine=0x8664 (AMD64)"

      - name: 打包
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "mcboost"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # 钩子
          Copy-Item "pcl-hook/out/hook/PclHook.dll" $stage
          $harmony = Get-ChildItem "$env:USERPROFILE\.nuget\packages\lib.harmony" -Recurse -Filter "0Harmony.dll" -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match "net452|netstandard2.0" } | Select-Object -First 1
          if (-not $harmony) { throw "找不到 0Harmony.dll" }
          Copy-Item $harmony.FullName $stage

          # 启动器：整个输出目录全拷。
          # 之前手动挑 .exe/.dll 漏掉了 runtimeconfig.json，
          # 缺它 .NET 应用根本起不来，Windows 会弹「要装 .NET」。
          Get-ChildItem "pcl-hook/out/launcher" -File |
            Where-Object { $_.Extension -ne ".pdb" } |
            ForEach-Object { Copy-Item $_.FullName $stage }

          # 说明文件用 ASCII 名，避免 Compress-Archive 把中文名弄成乱码
          Copy-Item "pcl-hook/README.txt" (Join-Path $stage "README.txt") -ErrorAction SilentlyContinue

          Write-Host "===== 打包内容 ====="
          Get-ChildItem $stage | ForEach-Object { Write-Host ("  {0,-34} {1,8} KB" -f $_.Name, [math]::Round($_.Length/1KB,1)) }

          Compress-Archive -Path "$stage/*" -DestinationPath "mcboost-pclce.zip" -Force
          Write-Host "`n  交付: mcboost-pclce.zip  $([math]::Round((Get-Item 'mcboost-pclce.zip').Length/1KB,1)) KB"

      - uses: actions/upload-artifact@v4
        with:
          name: mcboost-pclce
          path: mcboost-pclce.zip
          if-no-files-found: error
          retention-days: 30

      - name: 附加到 Release
        if: github.event_name == 'release'
        shell: pwsh
        run: gh release upload "${{ github.event.release.tag_name }}" "mcboost-pclce.zip" --repo "${{ github.repository }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
