name: 构建 PCL CE Hook DLL

on:
  push:
    branches: [main, master]
    paths:
      - 'pcl-hook/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'pcl-hook/**'
  workflow_dispatch:
    inputs:
      connections:
        description: '默认单文件连接数'
        required: false
        default: '24'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: 编译 PclHook
        run: dotnet build pcl-hook/PclHook/PclHook.csproj -c Release -o pcl-hook/out/hook

      - name: 编译注入器
        run: dotnet build pcl-hook/Injector/PclHookInjector.csproj -c Release -o pcl-hook/out/injector

      - name: 汇总产物
        shell: pwsh
        run: |
          $publish = "publish"
          New-Item -ItemType Directory -Force -Path $publish | Out-Null
          Copy-Item "pcl-hook/out/hook/PclHook.dll" $publish
          Get-ChildItem "pcl-hook/out/hook" -Filter "0Harmony.dll" -Recurse | ForEach-Object { Copy-Item $_.FullName $publish }
          Get-ChildItem "pcl-hook/out/hook" -Filter "*.deps.json" -Recurse | ForEach-Object { Copy-Item $_.FullName $publish }
          Copy-Item "pcl-hook/out/injector/PclHookInjector.exe" $publish
          Get-ChildItem "pcl-hook/out/injector" -Filter "*.dll" | Where-Object { $_.Name -ne "PclHook.dll" } | ForEach-Object { Copy-Item $_.FullName $publish }
          Write-Host "===== 产物清单 ====="
          Get-ChildItem $publish | ForEach-Object { Write-Host ("  {0,-32} {1,10} bytes" -f $_.Name, $_.Length) }

      - name: 加入使用说明
        shell: pwsh
        run: Copy-Item "pcl-hook/使用说明.txt" "publish/使用说明.txt"

      - name: 上传 DLL
        uses: actions/upload-artifact@v4
        with:
          name: PclHook
          path: publish/
          if-no-files-found: error
          retention-days: 30
